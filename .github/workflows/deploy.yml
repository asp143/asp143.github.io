name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 25
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Astro site
        run: npm run build
        env:
          PUBLIC_POSTHOG_KEY: ${{ secrets.PUBLIC_POSTHOG_KEY }}
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Upload sitemap for IndexNow
        uses: actions/upload-artifact@v4
        with:
          name: indexnow-sitemap
          path: dist/sitemap-0.xml
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download sitemap for IndexNow
        uses: actions/download-artifact@v5
        with:
          name: indexnow-sitemap
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Notify IndexNow
        continue-on-error: true
        shell: bash
        run: |
          mapfile -t urls < <(
            grep -o '<loc>[^<]*</loc>' dist/sitemap-0.xml \
              | sed -e 's#<loc>##' -e 's#</loc>##' \
              | head -n 100
          )

          if (( ${#urls[@]} == 0 )); then
            echo "No sitemap URLs found for IndexNow" >&2
            exit 1
          fi

          url_list="$(printf '%s\n' "${urls[@]}" \
            | sed -e 's/\\/\\\\/g' -e 's/"/\\"/g' -e 's/^/    "/' -e 's/$/"/' -e '$!s/$/,/')"

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header 'Content-Type: application/json; charset=utf-8' \
            --data-binary @- \
            https://api.indexnow.org/indexnow <<JSON
          {
            "host": "ralphjonas.com",
            "key": "7ce1b2f5bc1577e7a86ea8bcd9a29815",
            "keyLocation": "https://ralphjonas.com/7ce1b2f5bc1577e7a86ea8bcd9a29815.txt",
            "urlList": [
          ${url_list}
            ]
          }
          JSON
